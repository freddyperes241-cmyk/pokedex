<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Pokedex</title>
    <link rel="stylesheet" href="1.css">
</head>
<body>
    <div class="contenedor">
        <header>
            <h1>⚡ Mi Pokédex ⚡</h1>
        </header>

        <div class="buscador">
            <input type="text" id="buscar" placeholder="Buscar Pokémon por nombre o número...">
            <button id="btn-buscar">🔍 Buscar</button>
        </div>

        <div id="carta-pokemon" class="carta oculto">
            <div class="cabecera-carta">
                <span id="numero-pokemon">#000</span>
                <h2 id="nombre-pokemon">Nombre</h2>
            </div>
            <div class="imagen-contenedor">
                <img id="imagen-pokemon" src="" alt="Imagen del Pokémon">
            </div>
            <div class="tipos" id="tipos-pokemon"></div>
            <div class="informacion">
                <p><strong>Altura:</strong> <span id="altura"></span> m</p>
                <p><strong>Peso:</strong> <span id="peso"></span> kg</p>
                <p><strong>Experiencia base:</strong> <span id="experiencia"></span></p>
            </div>
        </div>

        <div id="mensaje-error" class="error oculto">
            ❌ Pokémon no encontrado. Intenta otro nombre o número.
        </div>
    </div>

    <script src="1.js"></script>
</body>
</html>
